<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Multi Provider</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        <div class="sidebar" id="sidebar">
            <button class="btn-new-chat" onclick="createNewChat()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                New Chat
            </button>
            <div class="chat-list" id="chatList">
                </div>
        </div>

        <div class="chat-header">
            <button class="btn-menu" onclick="toggleSidebar()" title="Chats">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            
            <div style="display: flex; align-items: center; gap: 8px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                AI Chatbot
            </div>

            <button class="btn-settings" id="btnSettings" onclick="toggleSettings()" title="Settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82 2 2 0 1 1-2.83 2.83 1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51 2 2 0 1 1-4 0 1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33 2 2 0 1 1-2.83-2.83 1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1 2 2 0 1 1 0-4 1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82 2 2 0 1 1 2.83-2.83 1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51 2 2 0 1 1 4 0 1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33 2 2 0 1 1 2.83 2.83 1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1 2 2 0 1 1 0 4 1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>

        <div class="settings-panel" id="settingsPanel">
                    <div class="api-row">
            <input type="text" id="apiKeyInput" placeholder="🔑 API Key বসান..." autocomplete="off" spellcheck="false">
            <button class="btn-connect" onclick="setApiKey()">Connect</button>
            <span class="status-badge status-offline" id="connectionStatus">Offline</span>
        </div>

            
            <select class="model-select" id="providerSelect" onchange="switchProvider(this.value)">
                <option value="openrouter">🔄 OpenRouter (Multi-Model)</option>
                <option value="openai">🤖 OpenAI Direct</option>
                <option value="groq">⚡ Groq (Fast & Free)</option>
                <option value="google">🔍 Google Gemini Direct</option>
                <option value="anthropic">🧠 Anthropic Claude Direct</option>
            </select>
            
            <select class="model-select" id="modelSelect" onchange="onModelChange()"></select>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="typing-indicator" id="typingIndicator">
            AI লিখছে
            <span class="typing-dots">
                <span></span><span></span><span></span>
            </span>
        </div>

                                <div class="chat-input-container">
            <textarea id="messageInput" placeholder="মেসেজ লিখুন..." autocomplete="off" autocorrect="off" spellcheck="false" rows="1" disabled></textarea>

            <button class="btn-send" id="sendButton" onclick="sendMessage()" disabled title="Send">
                <svg class="send-icon" viewBox="0 0 24 24">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>


    </div>

    <script src="script.js"></script>
</body>
</html>
